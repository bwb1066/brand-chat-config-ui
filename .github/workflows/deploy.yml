name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp build version
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          GIT_TAG=$(git describe --tags --always 2>/dev/null || echo "${GIT_SHA}")
          BUILD_TIME=$(date -u +%Y.%m.%d.%H%M)
          sed -i "s/const APP_VERSION = 'local'/const APP_VERSION = '${GIT_TAG} · ${BUILD_TIME}'/" app.js
          sed -i "s/const APP_COMMIT = 'local'/const APP_COMMIT = '${GIT_SHA}'/" app.js
          echo "APP_VERSION=${GIT_TAG} · ${BUILD_TIME} (${GIT_SHA})" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
