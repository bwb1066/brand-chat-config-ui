name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp build version
        run: |
          GIT_SHA=$(git rev-parse --short HEAD)
          GIT_TAG=$(git tag --points-at HEAD 2>/dev/null | head -1 || true)
          GIT_DESCRIBE=$(git describe --tags --always 2>/dev/null || echo "${GIT_SHA}")
          BUILD_TIME=$(date -u +%Y.%m.%d.%H%M)
          TAG_VALUE=${GIT_TAG:-${GIT_DESCRIBE}}
          echo "{\"tag\":\"${TAG_VALUE}\",\"time\":\"${BUILD_TIME}\",\"commit\":\"${GIT_SHA}\"}" > version.json
          cat version.json
          echo "Built: ${TAG_VALUE} · ${BUILD_TIME} (${GIT_SHA})" >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
